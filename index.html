<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efe5d8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221813" media="(prefers-color-scheme: dark)">
<script>
/* Apply a saved Light/Dark choice before first paint; "system" (no attribute) follows the device. */
(function () {
  try {
    var t = localStorage.getItem('amp.theme');
    if (t === 'light' || t === 'dark') {
      document.documentElement.setAttribute('data-theme', t);
      var c = t === 'dark' ? '#221813' : '#efe5d8';
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', c); });
    }
  } catch (e) {}
})();
</script>
<title>Ampersand</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23221813'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' dominant-baseline='middle' font-family='Georgia,serif' font-style='italic' font-size='46' fill='%23d39f8b'%3E%26%3C/text%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: the household's projects are a stack of colour swatches (the palette cards); tasks sit beside them as cards with a project-coloured edge. */
:root {
  /* Palette: Wood Bark, Bright Brown, Astronaut Blue, Enchanted Blue, Raucous Orange, Shy Champagne Blush + Sage, Sand, Ocean, Plum, Ivory */
  --bark: #30241e; --brown: #6d3f2f; --astronaut: #204759; --enchanted: #0e6f8d; --orange: #c4532c; --blush: #d39f8b;
  --sage: #4d4934; --sand: #b79679; --ocean: #4a5f60; --plum: #562d30; --ivory: #dbc5ae; --heather: #5e4a6e;
  /* Blue and orange are reserved for the two people; project swatches stay in earthy, non-blue hues. */

  --bg: #efe5d8;
  --surface: #f8f1e8;
  --surface-2: #e9ddcc;
  --ink: #2a1f1a;
  --muted: #6b5849;
  --line: #d6c5b0;
  --field-border: #8f7a66;
  --blue: #0e6f8d;
  --orange-text: #a5431f;
  --agent: #5d5a3e;
  --both: #562d30;
  --changed: #8a5a00;
  --on-band: #f4eadc;
  --focus: #0e6f8d;
  --toast-link: #e7b9a6;

  --font-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-body: "Albert Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #221813; --surface: #2f231d; --surface-2: #3a2b23; --ink: #efe2d1; --muted: #bea68f; --line: #4b3a30; --field-border: #94806e;
    --blue: #4fa6c4; --orange: #e57b54; --orange-text: #e57b54; --agent: #b8b38c; --both: #e0ab97; --changed: #e3b45e; --focus: #4fa6c4;
    --toast-link: #6d3f2f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #221813; --surface: #2f231d; --surface-2: #3a2b23; --ink: #efe2d1; --muted: #bea68f; --line: #4b3a30; --field-border: #94806e;
  --blue: #4fa6c4; --orange: #e57b54; --orange-text: #e57b54; --agent: #b8b38c; --both: #e0ab97; --changed: #e3b45e; --focus: #4fa6c4;
  --toast-link: #6d3f2f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-padding-bottom: 96px; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
::placeholder { color: var(--muted); opacity: 1; }
input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); flex: none; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus, h3[tabindex="-1"]:focus { outline: none; }

.wrap { max-width: 1060px; margin: 0 auto; padding: 18px 16px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
/* Grid cards size their column to the content's min width by default; long chips or terms would then push the page sideways. */
.capture, .gate, .task, .opt, .agreebox, .voided, .bookbox, .empty, .invite, .list, .done-list { grid-template-columns: minmax(0, 1fr); }
.chip { max-width: 100%; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.amp {
  font: italic 600 46px/0.8 var(--font-display);
  background: linear-gradient(135deg, var(--blue) 15%, var(--orange) 85%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.word { font: 600 25px/1 var(--font-display); letter-spacing: .22em; text-transform: uppercase; }
.who { display: flex; align-items: center; gap: 8px; }
.who .mono { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.seg button .dot { width: 9px; height: 9px; border-radius: 50%; }
.seg button[aria-pressed="true"] { background: var(--surface-2); }
.c-blue .dot, .dot.c-blue { background: var(--blue); }
.c-orange .dot, .dot.c-orange { background: var(--orange); }
.mode { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mode .mono { color: var(--agent); }

/* Capture */
.capture { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.capture label.lead { font: italic 500 24px/1.1 var(--font-display); }
.cap-row { display: flex; gap: 10px; align-items: stretch; }
.mic {
  flex: 0 0 52px; height: 52px; border-radius: 50%; border: 0;
  background: var(--ink); color: var(--bg); display: grid; place-items: center; align-self: center;
}
.mic[aria-pressed="true"] { background: var(--orange); color: var(--bg); box-shadow: 0 0 0 6px color-mix(in srgb, var(--orange) 25%, transparent); }
.mic svg { width: 22px; height: 22px; }
textarea#say {
  flex: 1; min-width: 0; min-height: 52px; resize: vertical; border: 1px solid var(--field-border); border-radius: 14px;
  padding: 13px 14px; background: var(--bg); line-height: 1.4;
}
textarea#say[readonly] { opacity: .7; }
.capture.is-private { border-style: dashed; border-color: var(--field-border); background: color-mix(in srgb, var(--sand) 10%, var(--surface)); }
.capture.is-private .chips { opacity: .55; }
.priv-badge { display: none; align-items: center; gap: 6px; justify-self: start; font-size: 12.5px; font-weight: 600; color: var(--bark); background: var(--sand); border-radius: 999px; padding: 3px 10px; }
.capture.is-private .priv-badge { display: inline-flex; }
.hint { font-size: 12.5px; color: var(--muted); }
@media (max-width: 600px) {
  /* Give the text box the full width on phones; mic and Add share the row below it. */
  .cap-row { flex-wrap: wrap; }
  textarea#say { flex: 1 1 100%; order: -1; min-height: 76px; }
  .cap-row .btn { flex: 1; min-height: 48px; }
}
@media (hover: none) { .hint { display: none; } }
.btn {
  border: 1px solid transparent; border-radius: 12px; padding: 9px 16px; font-weight: 600;
  background: var(--ink); color: var(--bg);
}
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { padding: 6px 12px; font-size: 13.5px; border-radius: 10px; }
.btn.link { background: none; border: 0; padding: 8px 2px; min-height: 36px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.btn.link:hover { color: var(--ink); }
.cap-row .btn { align-self: stretch; padding: 0 20px; }
.cap-foot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px dashed color-mix(in srgb, var(--field-border) 55%, var(--line)); background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 13px; color: var(--muted); text-align: left; }
.chip:hover { color: var(--ink); border-style: solid; }
.priv { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--muted); }
.agent-line { font-family: var(--font-mono); font-size: 12px; color: var(--agent); min-height: 18px; display: flex; gap: 8px; align-items: center; }
.agent-line.busy::before {
  content: ""; width: 34px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--agent), transparent); background-size: 200% 100%;
  animation: scan 1.4s linear 4; /* about 6 seconds, then it rests (WCAG 2.2.2) */
}
@keyframes scan { from { background-position: 100% 0; } to { background-position: -100% 0; } }

/* Summary */
.summary { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; gap: 7px; align-items: center; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); }
.pill b { font-family: var(--font-mono); font-weight: 500; }
.pill.needs { border-color: var(--ink); }
.pill.agreed { color: var(--both); border-color: var(--both); }
.pill.agent { color: var(--agent); }

/* Main grid */
.main { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); gap: 16px; } }

/* Swatch bands */
.bands { display: grid; border-radius: 18px; overflow: hidden; position: sticky; top: 12px; box-shadow: 0 1px 0 var(--line); }
.band:focus-visible { outline: 2px solid currentColor; outline-offset: -6px; }
.bands .band:first-child:focus-visible, .bands .band:last-child:focus-visible { outline-offset: -8px; }
.band {
  border: 0; text-align: left; color: var(--on-band); padding: 12px 18px; min-height: 52px;
  display: grid; gap: 2px; position: relative; transition: min-height .25s ease;
  background-image:
    radial-gradient(120% 140% at 90% 10%, rgba(255,255,255,.14), transparent 55%),
    linear-gradient(100deg, rgba(0,0,0,.10), transparent 45%);
}
.band .mono { font-size: 11px; }
.band .nm { font: 600 19px/1.1 var(--font-display); letter-spacing: .3em; text-transform: uppercase; }
.band[aria-pressed="true"] { min-height: 78px; }
.band[aria-pressed="true"] .nm::after { content: ""; display: block; width: 34px; height: 1px; background: currentColor; margin-top: 8px; opacity: .8; }
.b-all { background-color: var(--blush); color: var(--bark); }
.b-home { background-color: var(--ocean); }
.b-money { background-color: var(--sage); }
.b-kids { background-color: var(--heather); }
.b-weekend { background-color: var(--brown); }
.b-us { background-color: var(--plum); }
.b-mine { background-color: var(--sand); color: var(--bark); }
/* Must come after the base .band rules above so it wins. */
@media (max-width: 820px) {
  /* On phones the swatches become one row of chips you can scroll sideways, so tasks stay above the fold. */
  .bands {
    position: static; display: flex; align-items: flex-start; gap: 8px; overflow-x: auto; border-radius: 0; box-shadow: none;
    margin: 0 -16px; padding: 6px 16px 8px; scroll-padding-inline: 16px; scroll-snap-type: x proximity; scrollbar-width: none;
  }
  .bands::-webkit-scrollbar { display: none; }
  .bands .band { flex: 0 0 auto; min-height: 0; padding: 9px 14px; border-radius: 14px; scroll-snap-align: start; }
  .bands .band[aria-pressed="true"] { min-height: 0; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
  .bands .band .nm { font-size: 15px; letter-spacing: .2em; }
  .bands .band .mono { font-size: 10.5px; }
  .bands .band[aria-pressed="true"] .nm::after { display: none; }
  .bands .band:focus-visible { outline-offset: -5px; }
}

/* Tasks */
.list { display: grid; gap: 14px; }
.list h2 { font: italic 500 26px/1.1 var(--font-display); margin: 0; }
.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.list-head .mono { color: var(--muted); }
.task {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px 18px 14px 22px; display: grid; gap: 12px; position: relative; overflow: hidden;
}
.task::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--c, var(--sand)); }
.task.k-needs, .task.k-split { border-color: color-mix(in srgb, var(--ink) 45%, var(--line)); }
.t-top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.t-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); }
.t-meta .overdue { color: var(--changed); }
.task h3 { margin: 4px 0 0; font-size: 18px; line-height: 1.3; font-weight: 600; text-wrap: balance; }
.status { flex: none; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap; border: 1px solid var(--line); }
.status.needs, .status.split { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.status.agreed { background: var(--both); color: var(--bg); border-color: var(--both); }
.status.agent { color: var(--agent); border-color: var(--agent); }
.status.booked { color: var(--both); border-color: var(--both); }
.status.waiting, .status.open { color: var(--muted); }
.note { margin: 0; font-size: 14px; color: var(--muted); }
.note .mono { color: var(--agent); margin-right: 6px; }

.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.opt { border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px; display: grid; gap: 7px; background: var(--bg); }
.opt.mine { border-color: var(--me); box-shadow: inset 3px 0 0 var(--me); }
.opt.passed { border-style: dashed; border-color: var(--field-border); background: transparent; }
.opt.passed .opt-title { color: var(--muted); }
.opt-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.opt-head .vendor { color: var(--muted); font-size: 13px; }
.tag { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--agent); }
.tag.re { color: var(--changed); }
.opt-title { margin: 0; font-weight: 600; }
.opt-detail { margin: 0; font-size: 14px; color: var(--muted); }
.terms { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .04em; font-variant-numeric: tabular-nums; background: var(--surface-2); border-radius: 8px; padding: 6px 9px; justify-self: start; }
.opt-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.votes { display: flex; gap: 6px; flex-wrap: wrap; }
.vote { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.vote.yes.c-blue { border-color: var(--blue); color: var(--blue); }
.vote.yes.c-orange { border-color: var(--orange); color: var(--orange-text); }
.vote .dot { width: 8px; height: 8px; border-radius: 50%; opacity: .35; }
.vote.yes .dot { opacity: 1; }
.opt-actions { display: flex; gap: 6px; }
.stale { font-size: 12.5px; color: var(--changed); margin: 0; }

.agreebox {
  border-radius: 14px; padding: 14px; display: grid; gap: 10px;
  background: color-mix(in srgb, var(--both) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--both) 45%, var(--line));
}
.join { display: flex; align-items: center; gap: 0; height: 30px; }
.join .sw { width: 44px; height: 22px; }
.join .sw.c-blue { background: var(--blue); border-radius: 11px 0 0 11px; }
.join .sw.c-orange { background: var(--orange); border-radius: 0 11px 11px 0; }
.join .amp-mini { font: italic 600 28px/1 var(--font-display); color: var(--both); margin: 0 8px; order: 3; }
.fresh .join .sw.c-blue { animation: inL .7s cubic-bezier(.2,.8,.2,1); }
.fresh .join .sw.c-orange { animation: inR .7s cubic-bezier(.2,.8,.2,1); }
@keyframes inL { from { transform: translateX(-18px); opacity: .2; } }
@keyframes inR { from { transform: translateX(18px); opacity: .2; } }
.agreebox p { margin: 0; }
.agreebox .small { font-size: 13.5px; color: var(--muted); max-width: 62ch; }
.book-row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.book-row label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); flex: 1 1 230px; min-width: 0; max-width: 420px; }
.book-row select { border: 1px solid var(--field-border); border-radius: 10px; padding: 7px 10px; background: var(--surface); width: 100%; min-width: 0; max-width: 100%; }
.book-row .btn { background: var(--both); color: var(--bg); }

.voided { border: 1px dashed var(--changed); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.voided .v-title { margin: 0; font-weight: 700; color: var(--changed); }
.voided p { margin: 0; font-size: 13.5px; color: var(--muted); }
.diff { border-collapse: collapse; font-size: 13.5px; width: 100%; max-width: 520px; }
.diff th, .diff td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.diff th { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.diff td.was { text-decoration: line-through; text-decoration-color: var(--changed); color: var(--muted); }
.diff td.now { color: var(--changed); font-weight: 600; }
.diff-wrap { overflow-x: auto; }

.bookbox { border-radius: 14px; padding: 12px 14px; background: var(--surface-2); display: grid; gap: 4px; }
.bookbox p { margin: 0; }
.bookbox .mono { color: var(--both); }

.t-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.t-actions { display: flex; gap: 8px; flex-wrap: wrap; }
details.hist summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 8px 0; }
details.hist summary:hover { color: var(--ink); }
details.hist ol { margin: 8px 0 0; padding-left: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
details.hist li { display: grid; grid-template-columns: 92px 1fr; gap: 8px; }
details.hist li .mono { color: var(--muted); font-size: 10.5px; padding-top: 2px; }
details.hist .who-agent { color: var(--agent); }

.privcard { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px dashed var(--line); border-radius: 14px; background: var(--surface); }
.privcard .txt { flex: 1; }
.privcard .txt small { display: block; color: var(--muted); font-size: 12.5px; }
.privcard.done .txt span { text-decoration: line-through; color: var(--muted); }

.empty { border: 1px dashed var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 10px; justify-items: start; }
.empty p { margin: 0; color: var(--muted); max-width: 60ch; }
.empty .big { font: italic 500 24px/1.2 var(--font-display); color: var(--ink); }

.done-list { display: grid; gap: 6px; }
.done-list h2 { font: italic 500 22px/1.1 var(--font-display); margin: 8px 0 4px; }
.done-item { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 14px; }
.done-item .tick { width: 18px; height: 18px; border-radius: 50%; background: var(--both); color: var(--bg); display: grid; place-items: center; font-size: 11px; flex: none; }

.toast {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 12px; font-size: 14px;
  display: flex; gap: 6px; align-items: center; opacity: 0; visibility: hidden; pointer-events: none; transition: .25s;
  width: max-content; max-width: min(560px, calc(100% - 32px)); box-shadow: 0 8px 28px rgba(0,0,0,.22); z-index: 10;
}
.toast.show { opacity: 1; visibility: visible; transform: translateX(-50%); pointer-events: auto; }
.toast #toastMsg { flex: 1; padding: 4px 6px 4px 0; }
.toast button { background: none; border: 0; color: var(--toast-link); font-weight: 700; min-height: 36px; padding: 6px 10px; border-radius: 8px; flex: none; }
.toast #toastBtn { text-decoration: underline; text-underline-offset: 3px; }
.toast #toastClose { font-size: 20px; line-height: 1; font-weight: 400; color: var(--bg); opacity: .8; }
@media (max-width: 600px) {
  .toast { left: 12px; right: 12px; width: auto; max-width: none; transform: translateY(20px); }
  .toast.show { transform: none; }
}

@media (prefers-reduced-motion: reduce) {

  try {
    res = await Promise.race([
      sb.functions.invoke('agent', { body: Object.assign({ action, today: isoDay(d), weekday: DAYNAMES[d.getDay()] }, payload || {}) }),
      timeout
    ]);
  } finally { clearTimeout(timer); }
  const { data, error } = res;
  if (error) {
    let body = null;
    try { body = error.context && typeof error.context.json === 'function' ? await error.context.json() : null; } catch (e) {}
    const code = body && body.error;
    if (code === 'agent_not_configured') { state.agentOn = false; render(); }
    const err = new Error((body && (body.detail || body.error)) || error.message);
    err.code = code || (error.name === 'FunctionsFetchError' ? 'network' : undefined);
    throw err;
  }
  return data;
}

/* ---------- derived state ---------- */
function approvalsFor(taskId) {
  const out = {};
  for (const a of state.approvals) if (a.task_id === taskId) out[a.user_id] = a;
  return out;
}
function validYes(t, ap, uid) {
  const a = uid && ap[uid];
  if (!a || !a.yes_option_id) return null;
  const o = (t.options || []).find(x => x.id === a.yes_option_id);
  return o && termsHash(o) === a.yes_hash ? o : null;
}
function taskState(t) {
  const mine = state.uid, p = partner();
  if (t.status === 'done') return { key: 'done', label: 'Done', rank: 9 };
  if (t.status === 'booked') return { key: 'booked', label: 'Booked', rank: 6 };
  if (t.status === 'researching' && Date.now() - msOf(t.research_at) < 240000) return { key: 'agent', label: 'Agent researching', rank: 3 };
  const opts = t.options || [];
  const ap = approvalsFor(t.id);
  const a = validYes(t, ap, mine), b = p ? validYes(t, ap, p.user_id) : null;
  if (a && b && a.id === b.id) {
    if (state.checking.has(t.id)) return { key: 'agent', label: 'Agent checking live terms', rank: 2, option: a, checking: true };
    return { key: 'agreed', label: 'Both said yes', rank: 1, option: a };
  }
  if (!opts.length) {
    const label = !t.assignee ? 'Open' : (t.assignee === mine ? 'Yours' : `${nameOf(t.assignee)}'s`);
    return { key: 'open', label, rank: 5 };
  }
  if (a && b) return { key: 'split', label: 'You picked different ones', rank: 0 };
  if (!a) return { key: 'needs', label: 'Needs you', rank: 0 };
  return { key: 'waiting', label: p ? `Waiting on ${p.display_name}` : 'Waiting for your partner to join', rank: 4 };
}

          <option value="hold">Live terms match what you approved</option>
          <option value="nextday">Only ${esc(DAYNAMES[nd.getDay()])} is open now</option>
          <option value="price">Price went up to ${esc(money(priceJump(o.totalCents)))}</option>

      <button type="button" class="btn" data-act="book" data-task="${t.id}" aria-describedby="tt-${t.id}">Book it</button>
    </div>`}
  </div>`;
}

const FIELD_FMT = {
  vendor: ['Vendor', v => v],
  date: ['Date', v => fmtDay(v)],
  start: ['Starts', v => fmtTime(v)],
  end: ['Ends', v => fmtTime(v)],

  includes: ['Includes', v => v || '—']
};
function renderVoided(t) {
  const rows = (t.voided.diffs || []).map(d => {

    return `<tr><td>${esc(f[0])}</td><td class="was">${esc(f[1](d.was))}</td><td class="now">${esc(f[1](d.now))}</td></tr>`;

function renderBooked(t) {

function renderTask(t) {
  const s = taskState(t);
  const proj = PROJECTS.find(p => p.id === t.project) || PROJECTS[5];
  const ap = approvalsFor(t.id);
  const overdue = t.due && parseDay(t.due) < todayStart();
  const who = !t.assignee ? 'Both of you' : nameOf(t.assignee);
  const meta = [
    `<span class="mono">${esc(proj.name)}</span>`,
    `<span class="mono">${esc(who)}</span>`,
    t.due ? `<span class="mono ${overdue ? 'overdue' : ''}">${overdue ? 'Overdue · was due' : 'by'} ${esc(fmtDay(t.due))}${t.due_reason ? ` · ${esc(t.due_reason)}` : ''}</span>` : '',
    t.budget_cents ? `<span class="mono">budget ${esc(money(t.budget_cents))}</span>` : ''
  ].join('');
  const opts = t.options || [];
  const tctx = `data-task="${t.id}" aria-describedby="tt-${t.id}"`;
  let body = '';
  if (s.key === 'agent' && !s.checking) {
    const mins = Math.floor((Date.now() - msOf(t.research_at)) / 60000);
    body += `<div class="agent-line busy">searching for real options${t.budget_cents ? ` under ${esc(money(t.budget_cents))}` : ''}… ${mins >= 1 ? `still working, started ${mins} min ago` : 'this can take a minute or two'}</div>`;
  }
  if (t.agent_note && s.key !== 'agent' && t.status !== 'booked') body += `<p class="note"><span class="mono">agent</span>${esc(t.agent_note)}</p>`;
  if (t.voided && t.status !== 'booked') body += renderVoided(t);
  if (t.status === 'booked' && t.booking) body += renderBooked(t);
  else if (s.key === 'agreed' || s.checking) body += renderAgreed(t, s);
  if (opts.length && t.status !== 'booked' && !s.checking) {
    if (s.key === 'agreed') {
      // The agreed option is already spelled out above; tuck the rest away.
      const rest = opts.filter(o => o.id !== s.option.id);
      if (rest.length) body += `<details class="others" data-others="${t.id}"><summary>${rest.length} other option${rest.length > 1 ? 's' : ''}</summary><ul class="opts">${rest.map(o => renderOption(t, o, ap)).join('')}</ul></details>`;
    } else body += `<ul class="opts">${opts.map(o => renderOption(t, o, ap)).join('')}</ul>`;
  }
  const acts = [];
  if (!opts.length && s.key !== 'agent' && t.status !== 'booked' && state.agentOn !== false) {
    acts.push(`<button type="button" class="btn small" data-act="research" ${tctx}>Have the agent find options</button>`);
  }
  if (t.status === 'booked' || !opts.length) acts.push(`<button type="button" class="btn ghost small" data-act="done" ${tctx}>Mark done</button>`);
  const logItems = (t.log || []).slice().reverse().map(l => `<li><span class="mono">${esc(fmtStamp(l.at))}</span><span class="${l.who === 'agent' ? 'who-agent' : ''}">${esc(l.who === 'agent' ? 'Agent' : nameOf(l.who))}: ${esc(l.text)}</span></li>`).join('');
  const more = [];
  if (opts.length && state.agentOn !== false && t.status !== 'booked' && s.key !== 'agent') more.push(`<button type="button" class="btn link" data-act="research" ${tctx}>Get fresh options</button>`);
  if (opts.length && t.status !== 'booked') more.push(`<button type="button" class="btn link" data-act="done" ${tctx}>Mark done without booking</button>`);
  more.push(`<button type="button" class="btn link" data-act="remove" ${tctx}>Remove task</button>`);
  const editing = state.editing === t.id;
  const canEdit = t.status !== 'booked' && t.status !== 'done';
  return `<article class="task k-${s.key} ${editing ? 'editing' : ''}" data-id="${t.id}" style="--c:${proj.c || 'var(--sand)'}">
    <div class="t-top"><div class="t-main"><div class="t-meta">${meta}</div><h3 id="tt-${t.id}" tabindex="-1" dir="auto">${esc(t.title)}</h3></div>
      <div class="t-side"><span class="status ${s.key}">${esc(s.label)}</span>${canEdit && !editing ? `<button type="button" class="btn link edit-btn" data-act="edit" data-task="${t.id}" aria-label="Edit ${esc(t.title)}">Edit</button>` : ''}</div></div>
    ${editing ? renderEdit(t) : ''}
    ${body}
    <div class="t-foot"><div class="t-actions">${acts.join('')}</div>
      <details class="hist"><summary>History and more</summary><ol>${logItems}</ol><div class="t-actions" style="margin-top:8px">${more.join('')}</div></details>
    </div>
  </article>`;
}

/* Inline editor for what the agent guessed: title, project, who, due date and budget. */
function renderEdit(t) {

const draftOf = t => ({ title: t.title || '', project: t.project, assignee: t.assignee || '', due: t.due || '', due_reason: t.due_reason || '', budget: t.budget_cents ? String(t.budget_cents / 100) : '' });

function renderPriv(p) {

function renderList() {
  // With nothing at all to show, the swatches are hidden (first run), so never leave the user stuck on a project view.
  if (!state.tasks.length && !state.priv.length && !state.loadErrs.tasks && state.filter !== 'all') {
    if (state.filter === 'mine') setPrivate(false);
    state.filter = 'all';
    renderBands();
  }
  const f = state.filter;
  const proj = PROJECTS.find(p => p.id === f);
  let html = `<div class="list-head"><h2 tabindex="-1">${esc(proj.name)}</h2></div>`;
  if (state.loadErrs.tasks && !state.tasks.length && f !== 'mine') {
    // Never show the first-run screen when the list simply failed to load: it invites adding duplicates.
    $('#list').innerHTML = html + `<div class="empty error"><p class="big">Your list didn't load.</p>
      <p>This is a connection problem; nothing was lost. Try again in a moment.</p>
      <button type="button" class="btn small" data-act="reload">Try again</button></div>`;
    return;
  }
  const open = state.tasks.filter(t => t.status !== 'done' && (f === 'all' || t.project === f));
  open.sort((a, b) => (taskState(a).rank - taskState(b).rank) || (a.due || '9999').localeCompare(b.due || '9999'));
  if (f !== 'mine') html += open.map(renderTask).join('');
  if (f === 'all' || f === 'mine') html += state.priv.filter(p => !p.done || f === 'mine').map(renderPriv).join('');
  const nothing = (f === 'mine' ? state.priv.length : open.length + (f === 'all' ? state.priv.filter(p => !p.done).length : 0)) === 0;
  if (nothing) {
    if (!state.tasks.length && f === 'all') {
      const p = partner();
      html += `<div class="empty first"><p class="big">Start with one thing on your mind.</p>
        <ol class="steps">
          <li><strong>Say it in the box above,</strong> loosely, several things at once if you like. The agent sorts them into projects, works out deadlines and finds real options.</li>
          <li>${p ? `<strong>${esc(p.display_name)} is already here.</strong>` : '<strong>Invite your partner</strong> with the link above.'} You each say yes to an option; nothing is booked until you both agree on the same one.</li>
        </ol>
        <button type="button" class="btn ghost small" data-act="examples">Or add three example tasks to try it</button></div>`;
    } else if (f === 'mine') {
      html += `<div class="empty"><p>Nothing private yet. Tick "Keep it private" when you add something and only you will see it.</p></div>`;
    } else html += `<div class="empty"><p>Nothing open here.</p></div>`;
  }
  const done = state.tasks.filter(t => t.status === 'done' && (f === 'all' || t.project === f)).sort((a, b) => msOf(b.done_at) - msOf(a.done_at)).slice(0, 6);
  if (done.length && f !== 'mine') {
    html += `<div class="done-list"><h2>Done lately</h2>${done.map(t => `<div class="done-item"><span class="tick" aria-hidden="true">✓</span><span dir="auto">${esc(t.title)}</span><button type="button" class="btn link" data-act="undone" data-task="${t.id}">Reopen</button></div>`).join('')}</div>`;
  }
  $('#list').innerHTML = html;
  // First run: nothing to filter yet, so the project swatches and summary step aside for the add box and the steps.
  const firstRun = !state.tasks.length && !state.priv.length && !state.loadErrs.tasks;
  $('#mainGrid').classList.toggle('first-run', firstRun);
  $('#bands').hidden = firstRun;
}

/* ---------- focus & announcements ---------- */
const cssq = s => (window.CSS && CSS.escape ? CSS.escape(String(s)) : String(s).replace(/["\\]/g, '\\$&'));
/* Describe the focused control so the same control (or its nearest survivor) can be refocused after a re-render. */
function focusKey() {
  const ae = document.activeElement;
  if (!ae || ae === document.body || !ae.closest || !ae.closest('#bands, #list, #summary, #inviteSlot, #foot, #mode')) return null;
  const task = ae.dataset.task || (ae.closest('.task') && ae.closest('.task').dataset.id) || null;
  let sel = null;
  try { if (typeof ae.selectionStart === 'number') sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) {}
  return { el: ae, id: ae.id || null, act: ae.dataset.act || null, task, opt: ae.dataset.opt || null, f: ae.dataset.f || null, did: ae.dataset.id || null, summary: ae.tagName === 'SUMMARY', sel };
}
function restoreFocus(k) {
  if (!k || document.contains(k.el)) return;
  const q = s => document.querySelector(s);
  let el = null;
  if (k.id) el = document.getElementById(k.id);
  if (!el && k.f) el = q(`[data-act="filter"][data-f="${cssq(k.f)}"]`);
  if (!el && k.act && k.task) el = q(`[data-act="${cssq(k.act)}"][data-task="${cssq(k.task)}"]${k.opt ? `[data-opt="${cssq(k.opt)}"]` : ''}`);
  // A toggle swaps its button (Yes ↔ Take back, Pass ↔ Undo pass): land on its counterpart.
  const twin = { yes: 'unyes', unyes: 'yes', pass: 'unpass', unpass: 'pass' }[k.act];
  if (!el && twin && k.task) el = q(`[data-act="${twin}"][data-task="${cssq(k.task)}"]${k.opt ? `[data-opt="${cssq(k.opt)}"]` : ''}`);
  if (!el && k.task && k.opt) el = q(`[data-task="${cssq(k.task)}"][data-opt="${cssq(k.opt)}"]:not([data-act="optmore"])`);
  if (!el && k.task && k.opt) el = q(`[data-task="${cssq(k.task)}"][data-opt="${cssq(k.opt)}"]`);
  if (!el && k.summary && k.task) el = q(`.task[data-id="${cssq(k.task)}"] summary`);
  if (!el && k.did) el = q(`[data-id="${cssq(k.did)}"][data-act]`);
  if (!el && k.task) el = q(`.task[data-id="${cssq(k.task)}"] h3`);
  if (!el) el = q('#list h2');
  if (el) {
    el.focus({ preventScroll: true });
    if (k.sel && el.id === k.id && typeof el.setSelectionRange === 'function') { try { el.setSelectionRange(k.sel[0], k.sel[1]); } catch (e) {} }
  }
}
let announceTimer = null;
function announce(msg) {
  const el = $('#announce');
  if (!el || !msg) return;
  el.textContent = '';
  clearTimeout(announceTimer);
  announceTimer = setTimeout(() => { el.textContent = msg; }, 60);
}
let lastScreenKey = null, gateShown = false;
function focusNewScreen() {
  const key = state.screen + (state.sentTo ? ':sent' : '');
  if (key === lastScreenKey) return;
  lastScreenKey = key;
  if (state.screen === 'app' || state.screen === 'loading') return;
  const first = !gateShown;
  gateShown = true;
  const target = $('#root [data-autofocus]') || $('#root h1');
  // On first page load, only jump into a field on devices with a real keyboard (no surprise phone keyboards).
  if (target && (!first || !matchMedia('(hover: none)').matches)) target.focus({ preventScroll: true });
}

/* Keep what's typed in the edit form when a live update re-renders the list. */
function readEditDraft() {
  const form = state.editing && document.querySelector(`form[data-edit="${cssq(state.editing)}"]`);
  if (!form) return;
  const v = n => (form.elements[n] ? form.elements[n].value : '');
  state.editDraft = { title: v('title'), project: v('project'), assignee: v('assignee'), due: v('due'), due_reason: v('due_reason'), budget: v('budget') };
}

function render() {
  if (state.screen === 'loading') { $('#root').innerHTML = `<div class="wrap"><header class="top">${brand}</header><main><p class="mode" role="status">Loading your list…</p></main></div>`; focusNewScreen(); return; }
  if (state.screen === 'signin') { renderSignin(); focusNewScreen(); return; }
  if (state.screen === 'setup') { renderSetup(); focusNewScreen(); return; }
  if (state.screen === 'error') { renderError(); focusNewScreen(); return; }
  shell();
  focusNewScreen();
  const fk = focusKey();
  const agreedNow = new Set(state.tasks.filter(t => t.status !== 'done' && taskState(t).key === 'agreed').map(t => t.id));
  if (state.prevAgreed) for (const id of agreedNow) if (!state.prevAgreed.has(id)) { state.fresh.add(id); setTimeout(() => state.fresh.delete(id), 1500); }
  state.prevAgreed = agreedNow;
  // Tell screen readers about real status changes (a partner's yes, the agent finishing), not every repaint.
  const states = new Map(state.tasks.filter(t => t.status !== 'done').map(t => { const st = taskState(t); return [t.id, { label: st.label, key: st.key }]; }));
  const labels = new Map([...states].map(([id, v]) => [id, v.label]));
  if (state.prevLabels) {
    const msgs = [], alerts = [];
    for (const [id, label] of labels) {
      const was = state.prevLabels.get(id);
      if (was && was !== label) {
        msgs.push(`${getTask(id).title}: ${label}`);
        // Device notifications only for things that need you: your turn to pick, or ready to book.
        const k = states.get(id).key;
        if (k === 'needs' || k === 'split' || k === 'agreed') alerts.push(`${getTask(id).title}: ${label}`);
      }
    }
    // A partner's new yes matters even when my own status doesn't change ("Needs you" before and after).
    const pp = partner();
    if (pp && state.prevPartnerYes) for (const t of state.tasks) {
      if (t.status === 'done') continue;
      const y = validYes(t, approvalsFor(t.id), pp.user_id);
      const was = state.prevPartnerYes.get(t.id);
      if (y && y.id !== was && !alerts.some(a => a.startsWith(t.title + ':'))) alerts.push(`${t.title}: ${pp.display_name} said yes to ${y.vendor}`);
    }
    if (msgs.length) announce(msgs.slice(0, 3).join('. '));
    if (alerts.length && document.hidden && devNotifyOn()) {
      try { new Notification('Ampersand', { body: alerts.slice(0, 3).join('\n'), tag: 'ampersand-status' }); } catch (e) {}
    }
  }
  state.prevLabels = labels;
  const pp2 = partner();
  state.prevPartnerYes = new Map(pp2 ? state.tasks.map(t => { const y = validYes(t, approvalsFor(t.id), pp2.user_id); return [t.id, y ? y.id : null]; }) : []);
  const openDetails = new Set([...document.querySelectorAll('details.hist[open]')].map(d => d.closest('.task') && d.closest('.task').dataset.id));
  const openOthers = new Set([...document.querySelectorAll('details.others[open]')].map(d => d.dataset.others));
  readEditDraft();
  const selects = {}; document.querySelectorAll('.book-row select').forEach(s => { selects[s.id] = s.value; });
  const baseFocused = document.activeElement && document.activeElement.id === 'homeBase';
  if (!baseFocused) renderHeader();
  renderSummary(); renderBands(); renderList();
  document.querySelectorAll('details.hist').forEach(d => { const c = d.closest('.task'); if (c && openDetails.has(c.dataset.id)) d.open = true; });
  document.querySelectorAll('details.others').forEach(d => { if (openOthers.has(d.dataset.others)) d.open = true; });
  if (state.editing && state.editing !== state.savingEdit && !document.querySelector(`form[data-edit="${cssq(state.editing)}"]`)) {
    const gone = !getTask(state.editing);
    state.editing = null; state.editDraft = null; state.editBase = null;
    const msg = gone ? 'The task you were editing was removed, so your changes were not saved.'
      : 'The task you were editing moved to another project, so the edit was closed.';
    announce(msg); toast(msg);
  }
  for (const id in selects) { const s = document.getElementById(id); if (s) s.value = selects[id]; }
  restoreFocus(fk);
}

/* ---------- toast ---------- */
/* One toast at a time. A toast can carry an Undo, and an onExpire that commits the action
   when the toast goes away without Undo (timed out, dismissed, replaced, or the tab is hidden). */
let toastTimer = null, toastMs = 4500, toastExpire = null;
function hideToast(commit) {
  clearTimeout(toastTimer);
  $('#toast').classList.remove('show');
  const f = toastExpire;
  toastExpire = null;
  if (commit && f) f();
}
function armToast() { clearTimeout(toastTimer); toastTimer = setTimeout(() => hideToast(true), toastMs); }
function toast(msg, opts) {
  opts = typeof opts === 'function' ? { undo: opts } : (opts || {});
  // The settings sheet is a modal on the top layer and would cover the toast, so speak inside it instead.
  const dlg = document.getElementById('settings');
  if (dlg && dlg.open && !opts.undo && !opts.onExpire) { const st = $('#setStatus'); if (st) { st.textContent = ''; setTimeout(() => { st.textContent = msg; }, 30); } return; }
  if (toastExpire) { const f = toastExpire; toastExpire = null; f(); }
  $('#toast').classList.add('show'); // visible before the text changes, so screen readers announce it
  $('#toastMsg').textContent = msg;
  const btn = $('#toastBtn');
  btn.hidden = !opts.undo;
  btn.onclick = opts.undo ? () => { toastExpire = null; hideToast(false); opts.undo(); } : null;
  toastExpire = opts.onExpire || null;
  toastMs = opts.undo ? 8000 : 5000;
  armToast();
}
(function wireToast() {
  const el = $('#toast');
  // Pause while the pointer or keyboard focus is on the toast, so Undo stays reachable.
  el.addEventListener('mouseenter', () => clearTimeout(toastTimer));
  el.addEventListener('mouseleave', () => { if (el.classList.contains('show') && !el.contains(document.activeElement)) armToast(); });
  el.addEventListener('focusin', () => clearTimeout(toastTimer));
  el.addEventListener('focusout', e => { if (el.classList.contains('show') && !el.contains(e.relatedTarget)) armToast(); });
  $('#toastClose').addEventListener('click', () => hideToast(true));
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || !el.classList.contains('show')) return;
    if (document.querySelector('dialog[open]')) return; // Escape closes the dialog; it must not also commit a pending Undo
    hideToast(true);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && toastExpire) hideToast(true); });
})();

/* Turn raw server, network and auth errors into plain sentences. Messages the database raises on purpose pass through. */
const GENERIC_ERR = 'Something went wrong. Try again.';
const OWN_MESSAGES = /^(Sign in first|You are already in a household|Add your name|That invite code did not match a household|That household already has two people|Both of you need to join|You both need to say yes|This task is already|Task not found|You are not in a household)/;
function friendly(e) {
  if (!e) return GENERIC_ERR;
  if (e.friendly) return e.message;
  const m = String(e.message || e.error_description || e.msg || '');
  if (OWN_MESSAGES.test(m)) return /[.!?]$/.test(m) ? m : m + '.';
  if (e.code === 'timeout') return 'That took too long to answer. Try again in a moment.';
  if (/failed to fetch|networkerror|network request failed|load failed|err_internet|fetch failed/i.test(m) || e.name === 'AuthRetryableFetchError' || e.name === 'FunctionsFetchError' || e.code === 'network') return "Can't reach the server. Check your connection and try again.";
  if (/token has expired|token.*invalid|invalid.*token|otp.*(expired|invalid)/i.test(m)) return "That code didn't work or has expired. Check it, or send the link again.";
  if (/rate limit|only request this after|too many/i.test(m)) return 'Too many tries. Wait a minute, then try again.';
  if (/jwt expired|refresh token|not authenticated|invalid jwt|auth session missing/i.test(m)) return 'Your sign-in expired. Sign in again.';
  if (/row-level security|permission denied/i.test(m)) return "You don't have permission to do that.";
  if (/invalid.*email|email.*invalid|unable to validate email/i.test(m)) return 'Enter a valid email address.';

}
const userError = msg => Object.assign(new Error(msg), { friendly: true });

/* ---------- writes ---------- */
const logEntry = text => ({ at: Date.now(), who: state.uid, text });
async function patchTask(id, patch) {

  const before = i >= 0 ? state.tasks[i] : null;
  if (i >= 0) { state.tasks[i] = Object.assign({}, state.tasks[i], patch); render(); }
  const { error } = await sb.from('tasks').update(patch).eq('id', id);
  if (error) {

    const j = state.tasks.findIndex(t => t.id === id);

/* Show a failed write's message and keep the follow-up "couldn't refresh" toast from replacing it. */

    || { task_id: taskId, user_id: state.uid, household_id: state.household.id, yes_option_id: null, yes_hash: null, passed: [] };
  const next = Object.assign({}, cur, { passed: (cur.passed || []).slice() });
  mutate(next);
  const row = { task_id: taskId, user_id: state.uid, household_id: state.household.id, yes_option_id: next.yes_option_id, yes_hash: next.yes_hash, passed: next.passed, updated_at: new Date().toISOString() };
  const i = state.approvals.findIndex(a => a.task_id === taskId && a.user_id === state.uid);

  if (i >= 0) state.approvals[i] = row; else state.approvals.push(row);

  const { error } = await sb.from('approvals').upsert(row, { onConflict: 'task_id,user_id' });

}

function setCapStatus(text, busy) { const el = $('#capStatus'); if (!el) return; el.textContent = text; el.classList.toggle('busy', !!busy); }

/* The typed text stays in the box (read-only) until it is safely saved, so a hang or failure never loses it. */
let capturing = false;
async function capture() {
  if (capturing) return;
  const box = $('#say'), add = $('#add');
  const text = box.value.trim();
  if (!text) { box.focus(); return; }
  stopVoice();
  capturing = true; box.readOnly = true; add.disabled = true;
  try {
    if ($('#priv').checked) {
      const { error } = await sb.from('private_items').insert({ title: cut(text, 300) });
      if (error) { toast("Couldn't save that. " + friendly(error)); return; }
      box.value = '';
      setCapStatus('Saved to your private list. Only you can see it.');
      if (state.filter !== 'mine') setPrivate(false); // one private item at a time unless you're in "Just mine"
      refetchSoon('private_items');
      return;
    }
    let parsed = null, note = '';
    if (state.agentOn !== false) {
      setCapStatus('sorting that into tasks…', true);
      try { parsed = (await agent('parse', { text })).tasks; }
      catch (e) {
        note = e.code === 'agent_not_configured' ? 'Added as typed. The agent is not set up yet.'
          : e.code === 'timeout' ? 'Added as typed. The agent took too long, so it was not sorted this time.'
          : 'Added as typed. The agent could not sort it this time.';
      }
    }
    if (!Array.isArray(parsed) || !parsed.length) parsed = [fallbackParse(text)];
    const rows = parsed.map(p => ({
      household_id: state.household.id, title: cut(p.title || text, 200), project: PROJ_IDS.includes(p.project) ? p.project : 'us',
      assignee: p.assignee || null, due: p.due || null, due_reason: p.due_reason || null, research: !!p.research,
      budget_cents: p.budget_cents || null, log: [logEntry(`Added: "${cut(text, 200)}"`)]
    }));
    setCapStatus('saving…', true);
    const { data, error } = await sb.from('tasks').insert(rows).select();
    if (error) { setCapStatus(''); toast("Couldn't add that. " + friendly(error) + ' Your words are still in the box.'); return; }
    box.value = '';
    state.tasks = state.tasks.concat(data);
    render();
    setCapStatus(note || `added ${data.length}: ${data.map(t => `${t.title} → ${(PROJECTS.find(x => x.id === t.project) || {}).name}`).join(' · ')}`);
    for (const t of data) if (t.research && state.agentOn !== false) research(t.id);
  } finally {
    capturing = false; box.readOnly = false; add.disabled = false;
  }
}

async function research(taskId) {
  const t = getTask(taskId);
  if (!t) return;
  const i = state.tasks.indexOf(t);
  state.tasks[i] = Object.assign({}, t, { status: 'researching', research_at: new Date().toISOString() });
  render();
  try {
    const r = await agent('research', { taskId });
    if (r && r.ok && r.count > 0) nudge('options', taskId);
  }
  catch (e) {
    toast(e.code === 'agent_not_configured' ? "The agent isn't set up yet."
      : e.code === 'timeout' ? 'The agent is still searching. Options will show up here when they are ready.'
      : "The agent couldn't finish that one. Try again in a minute.");
  }
  refetchSoon('tasks');
}

async function book(taskId, scenario) {

  if (s.key !== 'agreed') { toast('You both need to say yes to the same option first.'); return; }
  state.checking.add(taskId); render();
  await sleep(1200);
  const { data, error } = await sb.rpc('book_task', { p_task: taskId, p_scenario: scenario });
  state.checking.delete(taskId);
  await Promise.all([fetchTable('tasks'), fetchTable('approvals')]);
  render();

/* ---------- voice (Web Speech API) ---------- */
let rec = null, listening = false, voiceBase = '', voiceFinal = '';
function setupVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  const mic = $('#mic');
  mic.hidden = false;
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) voiceFinal += r[0].transcript + ' '; else interim += r[0].transcript;
    }
    $('#say').value = voiceBase + voiceFinal + interim;
  };
  rec.onstart = () => { listening = true; mic.setAttribute('aria-pressed', 'true'); setCapStatus('listening… tap the mic again when you are done'); };
  rec.onend = () => { listening = false; mic.setAttribute('aria-pressed', 'false'); setCapStatus(''); };
  rec.onerror = e => {
    const msg = {
      'not-allowed': 'Microphone blocked. Allow it in your browser settings, or just type.',
      'service-not-allowed': 'Voice input is turned off in this browser. Typing still works.',
      'audio-capture': 'No microphone found. Typing still works.',
      'network': 'Voice input needs an internet connection. Typing still works.',
      'no-speech': "Didn't catch anything. Tap the mic and try again.",
      'language-not-supported': "Voice input doesn't support this language here. Typing still works."
    }[e.error];
    if (msg) toast(msg);
  };
  mic.addEventListener('click', () => {
    if (listening) { rec.stop(); return; }
    voiceBase = $('#say').value.trim() ? $('#say').value.trim() + ' ' : '';
    voiceFinal = '';
    try { rec.start(); } catch (e) { toast("Voice input couldn't start. Typing still works."); }
  });
}
function stopVoice() { if (rec && listening) try { rec.stop(); } catch (e) {} }

    }
    if (act === 'chip') { if (!capturing) { $('#say').value = b.textContent; $('#say').focus(); } return; }
    if (act === 'capture') { capture(); return; }
    if (act === 'examples') { await busy(() => addExamples()); return; }
    const t = id ? getTask(id) : null;
    if (act === 'yes' && t) {
      const o = (t.options || []).find(x => x.id === opt);
      if (o && await setMyApproval(id, a => { a.yes_option_id = o.id; a.yes_hash = termsHash(o); a.passed = a.passed.filter(x => x !== o.id); })) nudge('yes', id);
    }
    if (act === 'unyes') await setMyApproval(id, a => { a.yes_option_id = null; a.yes_hash = null; });
    if (act === 'pass') await setMyApproval(id, a => { if (!a.passed.includes(opt)) a.passed.push(opt); if (a.yes_option_id === opt) { a.yes_option_id = null; a.yes_hash = null; } });
    if (act === 'unpass') await setMyApproval(id, a => { a.passed = a.passed.filter(x => x !== opt); });
    if (act === 'book') { const sel = DEMO && document.getElementById('sc-' + id); await book(id, sel ? sel.value : 'hold'); }
    if (act === 'research') await research(id);
    if (act === 'done') await markDone(id);
    if (act === 'undone') await reopen(id);
    if (act === 'remove') removeTask(id);
    if (act === 'privremove') removePrivate(b.dataset.id);
  } catch (err) { console.warn(err); toast(friendly(err)); }
});
function closeEdit() {
  const id = state.editing;
  state.editing = null; state.editDraft = null; state.editBase = null; state.savingEdit = null; render();
  const btn = id && document.querySelector(`[data-act="edit"][data-task="${cssq(id)}"]`);
  if (btn) btn.focus();
}
/* Save the edit form: only changed fields are written, and the history says what changed. */
document.addEventListener('submit', async e => {
  const form = e.target.closest && e.target.closest('form[data-edit]');
  if (!form) return;
  e.preventDefault();
  const t = getTask(form.dataset.edit);
  if (!t) { closeEdit(); return; }
  const errEl = form.querySelector('.err');
  errEl.textContent = '';
  form.querySelectorAll('[aria-invalid]').forEach(x => x.removeAttribute('aria-invalid'));
  const v = n => (form.elements[n].value || '').trim();
  const title = v('title');
  if (!title) { errEl.textContent = 'Give the task a name.'; form.elements.title.setAttribute('aria-invalid', 'true'); form.elements.title.focus(); return; }
  const rawBudget = v('budget').replace(/[$,\s]/g, '');
  let budget = null;
  if (rawBudget) {
    const n = Number(rawBudget);
    if (!Number.isFinite(n) || n <= 0 || n > 10000000) { errEl.textContent = 'Budget should be a dollar amount, like 200 or 149.99.'; form.elements.budget.setAttribute('aria-invalid', 'true'); form.elements.budget.focus(); return; }
    budget = Math.round(n * 100);
  }
  const due = v('due');
  if (due && !parseDay(due)) { errEl.textContent = 'Pick a valid date, or leave it empty.'; form.elements.due.setAttribute('aria-invalid', 'true'); form.elements.due.focus(); return; }
  const next = { title: cut(title, 200), project: PROJ_IDS.includes(v('project')) ? v('project') : t.project, assignee: v('assignee') || null, due: due || null, due_reason: cut(v('due_reason'), 60) || null, budget_cents: budget };
  const labels = { title: 'name', project: 'project', assignee: 'who', due: 'due date', due_reason: 'reason for the date', budget_cents: 'budget' };
  // Compare with what the form started from, not the live task: a field your partner changed
  // meanwhile (and you didn't touch) keeps their value.
  const b0 = state.editBase || draftOf(t);
  const base = { title: cut(String(b0.title).trim(), 200), project: b0.project, assignee: b0.assignee || null, due: b0.due || null,
    due_reason: cut(String(b0.due_reason || '').trim(), 60) || null, budget_cents: b0.budget ? Math.round(Number(b0.budget) * 100) : null };
  const patch = {}, changed = [];
  for (const k in next) if (next[k] !== base[k] && (t[k] == null ? null : t[k]) !== next[k]) { patch[k] = next[k]; changed.push(labels[k]); }
  if (!changed.length) { closeEdit(); return; }
  patch.log = (t.log || []).concat(logEntry(`Changed the ${changed.join(', ')}.`));
  const btn = form.querySelector('[type="submit"]'); btn.disabled = true;
  state.savingEdit = t.id;
  try { await patchTask(t.id, patch); }
  catch (er) { state.savingEdit = null; if (document.contains(btn)) btn.disabled = false; return; }
  closeEdit();
  toast(`Saved: ${next.title}`);
});
document.addEventListener('keydown', e => { // capture phase, so it runs before the toast's Escape handler
  if (e.key === 'Escape' && state.editing && e.target.closest && e.target.closest('form[data-edit]')) { e.preventDefault(); e.stopImmediatePropagation(); closeEdit(); }
}, true);

/* Enter in a field runs the action named by its data-enter attribute. */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || !e.target.closest) return;
  const el = e.target.closest('[data-enter]');
  if (!el) return;
  e.preventDefault();
  const btn = document.querySelector(`[data-act="${cssq(el.dataset.enter)}"]`);
  if (btn && !btn.disabled) btn.click();
});
document.addEventListener('change', async e => {
  const b = e.target.closest('[data-act="privdone"]');
  if (!b) return;
  const p = state.priv.find(x => x.id === b.dataset.id);
  if (p) { p.done = b.checked; render(); const { error } = await sb.from('private_items').update({ done: b.checked }).eq('id', p.id); if (error) { toast(friendly(error)); refetchSoon('private_items'); } }
});

/* ---------- boot ---------- */
async function enterApp() {
  const m = await loadMembership(); // throws on a network/server error; null only means "not in a household yet"
  if (!m) { state.screen = 'setup'; render(); return; }
  state.household = { id: m.household_id };
  state.loadErrs = {};
  await loadAll();
  // Without these the app would look empty (and invite duplicate work), so show the retry screen instead.
  if (['households', 'members', 'tasks', 'approvals'].some(n => state.loadErrs[n])) {
    throw userError("We couldn't load your household's list. Check your connection and try again.");
  }
  state.screen = 'app';
  render();
  subscribe();
  agent('status')
    .then(r => { state.agentOn = !!(r && r.configured); state.agentUnreachable = false; render(); })
    .catch(e => { if (e.code !== 'agent_not_configured') { state.agentOn = null; state.agentUnreachable = true; render(); } });
  sb.functions.invoke('notify', { body: { action: 'status' } })
    .then(r => {
      if (!(r && r.data && typeof r.data.email === 'boolean')) return;
      state.emailOn = r.data.email;
      const dlg = $('#settings');
      if (!dlg || !dlg.open || !dlg.contains(document.activeElement)) renderSettings();
    })
    .catch(() => {});
}
let currentUid;
async function onSession(session) {
  const uid = session && session.user ? session.user.id : null;
  if (uid === currentUid) return;
  currentUid = uid;
  state.session = session; state.uid = uid;
  if (!uid) {
    if (channel) { sb.removeChannel(channel); channel = null; }
    Object.assign(state, { household: null, members: [], tasks: [], approvals: [], priv: [], screen: 'signin', sentTo: null, agentOn: null, agentUnreachable: false, live: undefined, loadErrs: {}, prevLabels: null, prevAgreed: null, filter: 'all', err: '', editing: null, editDraft: null, editBase: null, expanded: new Set(), checking: new Set(), fresh: new Set(), prevPartnerYes: null });
    render(); return;
  }
  // A failed lookup is a connection problem, never "you have no household": show a retry screen, not setup.
  try { await enterApp(); } catch (e) { console.warn(e); state.err = friendly(e); state.screen = 'error'; render(); }
}
(function boot() {
  try {
    const params = new URLSearchParams(location.search);
    const j = params.get('join');
    if (j) localStorage.setItem('amp.join', j.toUpperCase());
    if (j || params.has('demo')) {
      // Keep the invite code and demo choice, but take them out of the address bar so they aren't reshared or bookmarked.
      const u = new URL(location.href); u.searchParams.delete('join'); u.searchParams.delete('demo'); history.replaceState(history.state, '', u);
    }
  } catch (e) {}
  render();
  sb.auth.onAuthStateChange((_evt, session) => { setTimeout(() => onSession(session), 0); });
  sb.auth.getSession().then(({ data }) => onSession(data.session));
})();

window.__amp = { termsHash, priceJump, taskState, state, sb };
})();

</script>
